<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Google</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body data-page="reset-password">
  <main class="auth">
    <div class="auth__panel">
      <div class="auth__brand">
        <span class="brand__mark" aria-hidden="true">G</span>
        <h1 class="auth__title">Reset your password</h1>
        <p class="auth__sub">Enter your employee ID. If the account exists, a reset link goes to the work email on file.</p>
      </div>

      <div class="alert hidden" id="reset-alert" role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="identifier">Username <span class="req">*</span></label>
          <input class="input" type="text" id="identifier" name="identifier" required
                 data-label="Username" placeholder="e.g. jane.doe" autocomplete="username" autofocus>
          <span class="field__error"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="reset-submit">
          <span class="btn__label">Send reset link</span>
        </button>
      </form>

      <div class="auth__footer">
        <a href="login.html">Back to sign in</a>
        <span class="small">Administrators: contact the system administrator.</span>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
