<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checking permissions — Northline HR</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body data-page="validate-permissions">
  <main class="auth">
    <div class="auth__panel">
      <div class="auth__brand">
        <span class="brand__mark" aria-hidden="true">NL</span>
        <h1 class="auth__title">Checking your access</h1>
        <p class="auth__sub">Confirming which parts of the system this account may open.</p>
      </div>

      <div class="alert hidden" id="perm-alert" role="alert"></div>

      <ul class="check-list" id="perm-checks">
        <li data-state="running" data-check="identity"><span class="dot"></span>Identity confirmed</li>
        <li data-state="idle" data-check="role"><span class="dot"></span>Administrator role assigned</li>
        <li data-state="idle" data-check="scope"><span class="dot"></span>Employee management permission</li>
      </ul>

      <div id="perm-actions" class="hidden">
        <button type="button" class="btn btn--block" id="perm-retry" style="margin-bottom:12px">
          <span class="btn__label">Check again</span>
        </button>
        <button type="button" class="btn btn--primary btn--block" id="perm-signout">
          <span class="btn__label">Sign out securely</span>
        </button>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
