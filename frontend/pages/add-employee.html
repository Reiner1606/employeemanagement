<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add employee — Northline HR</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/employee.css">
</head>
<body data-page="add-employee">
  <div class="app">
    <aside class="sidebar" id="sidebar" data-open="false"></aside>

    <div class="shell">
      <header class="topbar">
        <button class="menu-toggle" data-menu-toggle aria-label="Open navigation" aria-expanded="false">&#9776;</button>
        <div>
          <h1 class="topbar__title">Add employee</h1>
          <p class="topbar__sub">Create a new record in the employee directory</p>
        </div>
        <span class="topbar__spacer"></span>
        <a class="btn btn--sm" href="employees.html"><span class="btn__label">Back to directory</span></a>
      </header>

      <main class="content">
        <div class="alert hidden" id="form-alert" role="alert"></div>
        <section class="card">
          <form id="employee-form" novalidate>
            <div id="form-fields">
              <div class="state"><span class="spinner"></span>Preparing the form</div>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/employee-form.js"></script>
</body>
</html>
