<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification code — Northline HR</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body data-page="verify-2fa">
  <main class="auth">
    <div class="auth__panel">
      <div class="auth__brand">
        <span class="brand__mark" aria-hidden="true">NL</span>
        <h1 class="auth__title">Enter your verification code</h1>
        <p class="auth__sub" id="twofa-subtitle">Open your authenticator app and enter the 6-digit code.</p>
      </div>

      <div class="alert hidden" id="twofa-alert" role="alert"></div>

      <form id="twofa-form" novalidate>
        <div class="field">
          <label for="code" class="sr-only">6-digit verification code</label>
          <input class="input code-input" type="text" id="code" name="code"
                 inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                 data-label="Verification code" data-pattern="^\d{6}$"
                 data-pattern-message="Enter the 6 digits from your authenticator app."
                 required placeholder="------" autofocus>
          <span class="field__error"></span>
        </div>

        <div class="code-meta">
          <span id="expiry">Code expires in 5:00</span>
          <button type="button" class="input-group__action" id="resend">Send a new code</button>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="twofa-submit" style="margin-top:16px">
          <span class="btn__label">Verify and continue</span>
        </button>
      </form>

      <div class="auth__footer">
        <a href="login.html">Back to sign in</a>
        <span class="small" id="twofa-account"></span>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
