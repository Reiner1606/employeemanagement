<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Northline HR</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body data-page="login">
  <main class="auth">
    <div class="auth__panel">
      <div class="auth__brand">
        <span class="brand__mark" aria-hidden="true">NL</span>
        <h1 class="auth__title" id="login-title">Employee sign in</h1>
        <p class="auth__sub" id="login-subtitle">Use your employee ID and password.</p>
      </div>

      <div class="alert hidden" id="login-alert" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="identifier" id="identifier-label">Employee ID <span class="req">*</span></label>
          <input class="input" type="text" id="identifier" name="identifier" autocomplete="username"
                 required data-label="Employee ID" placeholder="EMP-1001" autofocus>
          <span class="field__error"></span>
        </div>

        <div class="field">
          <label for="password">Password <span class="req">*</span></label>
          <div class="input-group">
            <input class="input" type="password" id="password" name="password"
                   autocomplete="current-password" required minlength="8" data-label="Password">
            <button type="button" class="input-group__action" id="toggle-password" aria-pressed="false">Show</button>
          </div>
          <span class="field__error"></span>
        </div>

        <div class="field field--inline">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember" class="small">Keep me signed in on this device</label>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="login-submit">
          <span class="btn__label">Continue</span>
        </button>
      </form>

      <div class="auth__footer">
        <a href="../index.html">Change role</a>
        <a href="reset-password.html" id="reset-link">Forgot password?</a>
      </div>
    </div>

    <p class="auth__note" id="dev-note"></p>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
